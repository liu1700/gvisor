# Plori fork release: build runsc and the containerd shim with plain Go from this
# synthetic go branch and publish them in the layout plori-runtime's installers
# expect. No bazel, no Docker build container, no apt repository, x86_64 only.
name: plori-release

on:
  push:
    tags:
      - "release-*-plori.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          set -euo pipefail
          tools/plori-release-build.sh "${GITHUB_REF_NAME}"
          cat gvisor.tar.bz2.sha512
      - name: Install native FUSE test dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config gcc python3 git sqlite3
      - name: Qualify the release binaries
        run: tests/fuse/qualify.sh out/runsc results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuse-release-qualification
          path: results/*.jsonl
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" gvisor.tar.bz2 gvisor.tar.bz2.sha512 \
            --title "${GITHUB_REF_NAME}" \
            --notes "runsc, containerd-shim-runsc-v1, and all standard upstream sidecars (linux/amd64) built from ${GITHUB_SHA}."
